<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HX Chat</title>
  <meta name="theme-color" content="#313338">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ícones (Feather, MIT) — monocromáticos via currentColor -->
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></symbol>
    <symbol id="i-phone-off" viewBox="0 0 24 24"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3.03a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3.03a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-headset" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><path d="M4 15a2 2 0 0 1 2-2h1v6H6a2 2 0 0 1-2-2zM20 15a2 2 0 0 0-2-2h-1v6h1a2 2 0 0 0 2-2z"/></symbol>
    <symbol id="i-headset-off" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M4 15v-3a8 8 0 0 1 12.5-6.6M20 13.5V12"/><path d="M4 15a2 2 0 0 1 2-2h1v6H6a2 2 0 0 1-2-2zM20 15v-1m-3 5h1a2 2 0 0 0 1.8-1.2"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
  </svg>

  <!-- Tela de login -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>HX</h1>
      <p>Entre com sua conta para acessar o servidor</p>
      <form id="login-form">
        <input id="username-input" type="text" placeholder="Usuário" maxlength="32" autocomplete="username">
        <input id="password-input" type="password" placeholder="Senha" maxlength="72" autocomplete="current-password">
        <button id="login-btn" type="submit">Entrar</button>
        <button id="register-btn" type="button" class="secondary">Criar conta</button>
      </form>
      <button id="install-btn" class="secondary hidden">Instalar como aplicativo</button>
      <div id="login-error" class="error"></div>
    </div>
  </div>

  <!-- Tela principal -->
  <div id="main-screen" class="screen hidden">
    <nav class="server-rail">
      <div class="rail-icon active" title="HX">
        <svg viewBox="0 0 48 48">
          <text x="8" y="33" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="900" font-size="26" fill="#fff">H</text>
          <text x="23" y="37" font-family="Segoe UI, sans-serif" font-style="italic" font-weight="900" font-size="26" fill="#f23f43">X</text>
        </svg>
      </div>
    </nav>
    <aside class="sidebar">
      <div class="server-header">HX</div>
      <div class="channels">
        <div class="channel-label">Canais de texto</div>
        <div class="channel active"># geral</div>
        <div class="channel-label">Canais de voz</div>
        <div class="channel" id="voice-channel"><svg class="icon"><use href="#i-volume"/></svg> Voz</div>
        <ul id="voice-users" class="voice-users"></ul>
      </div>
      <div class="voice-controls hidden" id="voice-controls">
        <button id="mute-btn" title="Mutar / Desmutar microfone" aria-pressed="false"><svg class="icon"><use id="mute-icon" href="#i-mic"/></svg></button>
        <button id="deafen-btn" title="Silenciar / Ouvir o canal" aria-pressed="false"><svg class="icon"><use id="deafen-icon" href="#i-headset"/></svg></button>
        <button id="screen-btn" title="Compartilhar tela ou aplicativo"><svg class="icon"><use href="#i-monitor"/></svg></button>
        <button id="leave-voice-btn" title="Desconectar da voz"><svg class="icon"><use href="#i-phone-off"/></svg></button>
      </div>
      <div class="user-footer" id="user-footer" title="Editar perfil">
        <span id="self-avatar"></span>
        <span id="self-name"></span>
      </div>
    </aside>

    <main class="content">
      <div class="channel-title"><button id="menu-btn" title="Menu"><svg class="icon"><use href="#i-menu"/></svg></button># geral</div>
      <div id="screens" class="screens hidden"></div>
      <div id="messages" class="messages"></div>
      <div id="typing-line"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Mensagem em #geral" maxlength="2000" autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
    </main>

    <aside class="members">
      <div class="channel-label">Online</div>
      <ul id="user-list"></ul>
    </aside>
  </div>

  <!-- Prévia de transmissão (abre ao clicar no badge AO VIVO) -->
  <div id="preview-overlay" class="hidden">
    <div id="preview-card">
      <button id="preview-close" title="Fechar"><svg class="icon"><use href="#i-x"/></svg></button>
      <img id="preview-img" alt="Prévia da transmissão">
      <div id="preview-empty" class="hidden">Aguardando prévia…</div>
      <div id="preview-title"></div>
      <button id="preview-watch"></button>
    </div>
  </div>

  <!-- Editar perfil -->
  <div id="profile-overlay" class="hidden">
    <div id="profile-card">
      <button id="profile-close" title="Fechar"><svg class="icon"><use href="#i-x"/></svg></button>

      <header class="profile-header">
        <div id="profile-avatar-holder" title="Clique para trocar a foto">
          <div class="avatar-overlay"><svg class="icon"><use href="#i-image"/></svg></div>
        </div>
        <div class="profile-id">
          <div id="profile-display-name"></div>
          <div class="profile-sub">Servidor HX</div>
        </div>
      </header>

      <input id="avatar-file" type="file" accept="image/*" hidden>

      <section class="profile-section">
        <div class="section-label">Foto de perfil</div>
        <div class="profile-actions">
          <button id="avatar-pick" class="btn-primary"><svg class="icon"><use href="#i-image"/></svg> Trocar foto</button>
          <button id="avatar-remove" class="btn-danger"><svg class="icon"><use href="#i-trash"/></svg> Remover</button>
        </div>
      </section>

      <section class="profile-section">
        <div class="section-label">Nome de exibição</div>
        <div class="rename-row">
          <input id="rename-input" type="text" maxlength="32" placeholder="Seu nome">
          <button id="rename-save" class="btn-primary" title="Salvar nome"><svg class="icon"><use href="#i-check"/></svg></button>
        </div>
        <div class="section-hint">3 a 32 caracteres. Também é o nome usado para entrar.</div>
      </section>

      <section class="profile-section">
        <div class="section-label">Áudio</div>
        <label class="toggle-row">
          <span>
            Redução de ruído
            <span class="section-hint">Filtra ventilador, teclado e eco do microfone.</span>
          </span>
          <input id="noise-toggle" type="checkbox" checked>
        </label>
      </section>

      <div id="profile-error" class="error"></div>
      <div id="profile-ok" class="ok"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
